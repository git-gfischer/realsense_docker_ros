# =============================================================================
# docker-compose.yml — RealSense + ROS2 Humble on Jetson AGX Orin
#
# Usage:
#   Build image:          docker compose build
#   Start shell:          docker compose run realsense_ros2
#   Launch camera node:   docker compose run realsense_ros2 \
#                           ros2 launch realsense2_camera rs_launch.py
#   Multi-camera:         docker compose run realsense_ros2 \
#                           ros2 launch realsense2_camera rs_multi_camera_launch.py
# =============================================================================
 
services:
  realsense_ros2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        L4T_VERSION: "r36.3.0"
        LIBREALSENSE_VERSION: "v2.55.1"
        REALSENSE_ROS_VERSION: "4.55.1"
 
    image: realsense-ros2-jetson:humble
    env_file: .camera
    # ── Networking ──────────────────────────────────────────────────────────
    # host mode let ROS2 DDS discovery work without extra config
    network_mode: host
 
    # ── Device access ───────────────────────────────────────────────────────
    # privileged gives access to the host's patched kernel modules (uvcvideo)
    # and all USB devices. Alternatively, replace with specific --device entries.
    privileged: true
 
    volumes:
      # Full /dev — needed for USB cameras and V4L devices
      - /dev:/dev
      # udev rules (read-only is enough at runtime)
      - /run/udev:/run/udev:ro
      # Optional: persist ROS2 logs on the host
      - ./ros2_logs:/root/.ros
      - ./realsense_d435_cam.sh:/ros2_ws/realsense_d435_cam.sh
 
    environment:
      # Display forwarding (for rviz2 / rqt — requires `xhost +local:docker` on host)
      - DISPLAY=${DISPLAY:-:0}
      - XAUTHORITY=${XAUTHORITY:-}
      # NVIDIA / CUDA
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
 
    # Interactive shell by default
    stdin_open: true
    tty: true
 
    # Restart policy — disable for development, enable for production
    restart: "no"
    runtime: nvidia
    # Let the script read values from the container environment loaded via
    # `env_file`; Compose would otherwise expand $VARS on the host side.
    command: ["bash", "/ros2_ws/realsense_d435_cam.sh"]
    # ── Hardware accelerated rendering (for rviz2) ──────────────────────────
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu, compute, utility, video]
 
# =============================================================================
# NOTE: If you want to run multiple camera nodes simultaneously,
# launch each as a separate service and override the camera serial number:
#
#   realsense_cam1:
#     extends: realsense_ros2
#     command: >
#       ros2 launch realsense2_camera rs_launch.py
#         serial_no:="_<SERIAL_1>" camera_namespace:=cam1
#
#   realsense_cam2:
#     extends: realsense_ros2
#     command: >
#       ros2 launch realsense2_camera rs_launch.py
#         serial_no:="_<SERIAL_2>" camera_namespace:=cam2
# =============================================================================
